<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — YIM</title>
  <link rel="icon" href="assets/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker"><i></i> Gallery</p>
        <h1>The work, as it looks on the ground.</h1>
        <p>Photographs from yim.org.za — outreach tents, after-school teams, gardens, parcels, sport and heritage days across Gauteng, Mpumalanga and KwaZulu-Natal.</p>
      </div>
    </section>
    <section>
      <div class="wrap gallery-6">
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/yimteam.jpg" alt="YIM team"><p class="caption">Programme team</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/YIMKZNTeam.jpeg" alt="KZN after-school team"><p class="caption">KwaZulu-Natal after-school team</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/Outreach_Tent.jpg" alt="Outreach tent"><p class="caption">HTS outreach tent</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/testingServices.jpg" alt="Testing services"><p class="caption">Community testing day</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/yimhealth.jpg" alt="Health team"><p class="caption">Health outreach</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/YIMontheStreets.jpg" alt="Street outreach"><p class="caption">Street and clinic outreach</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/learners.jpg" alt="Learners"><p class="caption">Learners in the after-school programme</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/afterschool.jpg" alt="After school"><p class="caption">After-school session</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/classroom.jpg" alt="Classroom"><p class="caption">Classroom support</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/Tutoring_YIM.jpg" alt="Tutoring"><p class="caption">Tutoring</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/kids.jpg" alt="Children"><p class="caption">Children at a YIM site</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/schoolKids.jpg" alt="School children"><p class="caption">School partnership</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/CultureKids.jpg" alt="Heritage celebration"><p class="caption">Heritage and culture day</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/yimsession.jpg" alt="Programme session"><p class="caption">Community session</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/foodparcels.jpg" alt="Food parcels"><p class="caption">Household food parcels</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/socialteam.jpg" alt="Social team"><p class="caption">Social development team</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/Gardening/Mpumalanga/gardening.jpg" alt="Mpumalanga garden"><p class="caption">Food garden, Mpumalanga</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/Sport/Netball.jpeg" alt="Netball"><p class="caption">Youth netball</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/Sport/Soccer1.jpeg" alt="Soccer"><p class="caption">Youth soccer</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/FacebookScrape/heritage.jpg" alt="Heritage day"><p class="caption">Heritage celebration</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/FacebookScrape/Ngudumeni.jpg" alt="Community gathering"><p class="caption">Community gathering</p></figure>
        <figure class="figure"><img class="photo" src="https://www.yim.org.za/images/Hlobi.jpg" alt="Director"><p class="caption">Hlobi Ngidi</p></figure>
      </div>
    </section>
  </main>
  <script src="js/logos.js"></script>
  <script src="js/main.js"></script>

</html>
