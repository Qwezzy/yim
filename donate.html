<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Donate — YIM</title><link rel="stylesheet" href="css/styles.css"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet"></head><body><main><section class="page-hero"><div class="wrap"><p class="kicker"><i></i> Donate</p><h1>Give to the work.</h1><p id="statusBanner" class="notice" hidden></p></div></section><section><div class="wrap split"><form class="donate-box" id="donateForm"><h2>Card or instant EFT</h2><div class="amounts" id="amounts"></div><div class="field"><label for="customAmount">Custom amount (ZAR)</label><input id="customAmount" type="number" min="10" step="1"></div><div class="field"><label for="freq">Frequency</label><select id="freq"><option value="once">Once-off</option><option value="monthly">Monthly</option></select></div><div class="field"><label for="cause">Direct this gift</label><select id="cause"><option>Where most needed</option><option>Health</option><option>Social development</option><option>Education / after school</option></select></div><div class="field"><label for="donorName">Name</label><input id="donorName" required></div><div class="field"><label for="donorEmail">Email</label><input id="donorEmail" type="email" required></div><p>Total <b id="totalLabel">R350.00</b></p><button class="btn btn-primary" type="submit">Continue to PayFast</button><p class="notice" id="modeNote"></p></form><div><h2>EFT</h2><div class="bank" id="bankBox"></div></div></div></section></main><script src="js/config.js"></script><script src="js/logos.js"></script><script src="js/main.js"></script><script src="js/donate.js"></script></body></html>
